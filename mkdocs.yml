site_name: ImageKodec
site_url: https://yuroyami.github.io/ImageKodec/
site_description: Image codecs written in Kotlin for Kotlin Multiplatform. Decode PNG, JPEG, GIF, BMP, TIFF, JPEG 2000, WebP, AVIF and JPEG XL from common code, with no platform image APIs underneath.
site_author: yuroyami
copyright: Apache-2.0

repo_name: yuroyami/ImageKodec
repo_url: https://github.com/yuroyami/ImageKodec
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - theme/kite.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search

nav:
  - Home: index.md
  - Guides:
      - Reading images: decoding.md
      - Color management: color.md
      - Animation: animation.md
      - Writing images: encoding.md
      - Resizing and orientation: resizing.md
      - Compose and Coil: compose-and-coil.md
  - Reference:
      - Limits: limits.md
      - API reference: https://yuroyami.github.io/ImageKodec/api/
