[versions] #######################################################################################
# The imagekodec core depends on ArchiveKodec only. The other versions serve imagekodec-compose and imagekodec-coil.
archivekodec = "0.2.0"
# The Kotlin version is in library.module-template.yaml, the Compose version in compose.module-template.yaml.
skiko = "0.156.1"
coil = "3.6.3"
# The sample's Material 3. The toolchain cannot map every Compose version to a Material 3 version, so it is set here.
composeMaterial3 = "1.13.0-rc01"
# Android host tests of the Android image conversions (#90).
robolectric = "4.18"

[libraries] ######################################################################################
# imagekodec: DEFLATE, zlib and CRC-32.
archivekodec = { module = "io.github.yuroyami:archivekodec", version.ref = "archivekodec" }

# sample only.
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }

# imagekodec-coil: the Coil interop module.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-singleton = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil" }

# JVM tests only: the Skiko native runtimes, so headless tests can rasterize.
skiko-awt-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-awt-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-awt-runtime-linux-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-arm64", version.ref = "skiko" }
skiko-awt-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
skiko-awt-runtime-windows-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-arm64", version.ref = "skiko" }
