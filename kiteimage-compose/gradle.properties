POM_NAME=KiteImage Compose
POM_DESCRIPTION=Compose Multiplatform binding for KiteImage: the KiteImage() composable, which auto-detects animated versus static input and plays GIF, APNG and animated lossless WebP with correct delays, disposal and loop count, plus KiteBitmap-to-ImageBitmap conversion. Builds for the seven Compose Multiplatform targets, not the full KiteImage core set.
