plugins:
  abi-check:
    enabled: true
    # `./kotlin check klibAbi` needs a `./kotlin build` of each of these platforms first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, linuxX64, linuxArm64, mingwX64, js, wasmJs, wasmWasi ]
  dokka:
    enabled: true
    moduleName: imagekodec
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · ImageKodec is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/ImageKodec/blob/main/imagekodec/src
    # The merged site at build/dokka/html. `./kotlin do dokka`, then `./kotlin do dokkaSite`.
    siteName: ImageKodec
    siteModules: [ imagekodec, imagekodec-compose, imagekodec-coil ]
    siteIncludes: [ ../imagekodec-compose/Module.md, ../imagekodec-coil/Module.md ]
