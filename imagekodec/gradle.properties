POM_NAME=ImageKodec
POM_DESCRIPTION=Pure-Kotlin image codec core for Kotlin Multiplatform. Decodes PNG and APNG, JPEG, GIF, BMP, TIFF, JPEG 2000, WebP (lossy, lossless and animated), AVIF and JPEG XL; encodes PNG and APNG, JPEG, GIF, BMP, TIFF and lossless WebP. Header-only probing, EXIF orientation, colour conversion to sRGB, geometry ops and hostile-input guards. kotlin-stdlib only; 22 targets across Android, JVM, Apple, Linux, Windows, androidNative, JS and Wasm.
