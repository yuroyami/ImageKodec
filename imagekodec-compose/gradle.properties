POM_NAME=ImageKodec Compose
POM_DESCRIPTION=Compose Multiplatform binding for ImageKodec: the KiteImage() composable, which auto-detects animated versus static input and plays GIF, APNG, animated WebP, animated AVIF and animated JPEG XL with correct delays, disposal and loop count, plus KiteBitmap-to-ImageBitmap conversion. Builds for the seven Compose Multiplatform targets, not the full ImageKodec core set.
