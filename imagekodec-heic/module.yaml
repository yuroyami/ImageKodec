product:
  type: kmp/lib
  # Every platform of the core, so a HEIC photo decodes wherever the core runs.
  platforms:
    - jvm
    - android
    - iosArm64
    - iosSimulatorArm64
    - iosX64
    - macosArm64
    - tvosArm64
    - tvosSimulatorArm64
    - watchosArm32
    - watchosArm64
    - watchosDeviceArm64
    - watchosSimulatorArm64
    - androidNativeArm32
    - androidNativeArm64
    - androidNativeX64
    - androidNativeX86
    - linuxX64
    - linuxArm64
    - mingwX64
    - js
    - wasmJs
    - wasmWasi

# The HEVC decoder of HEIC, written from ITU-T H.265. It is a module of its own so that an app
# that reads no HEIC carries none of its code, and so that the patents on HEVC stay out of the core.

aliases:
  - jvmAndAndroid: [ jvm, android ]

apply:
  - //library.module-template.yaml

# The codec registers with the core's registry, so an app needs the core's API with it.
dependencies:
  - //imagekodec: exported

test-dependencies:
  - //imagekodec-testkit

settings:
  kotlin:
    optIns: [ kotlin.RequiresOptIn, io.github.yuroyami.imagekodec.ExperimentalHeifCodecApi ]
  android:
    namespace: io.github.yuroyami.imagekodec.heic
    compileSdk:
      apiLevel: 37
      minorApiLevel: 2
    minSdk: 21
  publishing:
    pom:
      name: ImageKodec HEIC
      description: >-
        HEIC for ImageKodec: reads and writes the photos of recent iPhones and many Android phones. The HEVC
        decoder and encoder are pure Kotlin, written from ITU-T H.265, with no libheif, libde265 or platform
        codec underneath. Builds for the same 22 targets as the core. HEVC is covered by patents, so check
        what applies to your product before you ship this module.

# The same heap as the core's tests, so a size guard and not the allocator rejects a large header.
test-settings@jvm:
  jvm:
    test:
      freeJvmArgs: [ -Xmx3g ]

plugins:
  abi-check:
    enabled: true
    # `./kotlin check klibAbi` needs a `./kotlin build` of each of these platforms first.
    klibPlatforms: [ iosArm64, iosSimulatorArm64, iosX64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm32, watchosArm64, watchosDeviceArm64, watchosSimulatorArm64, androidNativeArm32, androidNativeArm64, androidNativeX64, androidNativeX86, linuxX64, linuxArm64, mingwX64, js, wasmJs, wasmWasi ]
  dokka:
    enabled: true
    moduleName: imagekodec-heic
    includes: [ Module.md ]
    customStyleSheets: [ ../docs/api-theme/kite.css ]
    templatesDir: ../dokka-templates
    footerMessage: Apache-2.0 · ImageKodec is part of the Kite family.
    sourceLinkUrl: https://github.com/yuroyami/ImageKodec/blob/main/imagekodec-heic/src
