POM_NAME=KiteImage
POM_DESCRIPTION=Pure-Kotlin image codec core for Kotlin Multiplatform. Decodes PNG and APNG, JPEG (baseline and progressive), GIF, BMP, lossless WebP (VP8L only; lossy VP8 is not implemented), TIFF (first IFD) and JPEG 2000; encodes PNG, JPEG, GIF and BMP. Header-only probing, EXIF orientation, geometry ops and hostile-input guards. kotlin-stdlib only; 22 targets across Android, JVM, Apple, Linux, Windows, androidNative, JS and Wasm.
