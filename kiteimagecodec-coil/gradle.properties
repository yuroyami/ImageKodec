POM_NAME=KiteImageCodec Coil
POM_DESCRIPTION=Coil interop for KiteImageCodec: KiteImageDecoder plugs the pure-Kotlin codecs into Coil's pipeline while network and caching stay Coil's, and KiteAsyncImage() plays GIF, APNG and animated lossless WebP. Builds for the seven Compose Multiplatform targets, not the full KiteImageCodec core set; add kiteimagecodec-compose yourself, it is not exposed transitively.
