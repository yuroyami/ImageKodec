POM_NAME=ImageKodec Coil
POM_DESCRIPTION=Coil interop for ImageKodec: KiteImageDecoder plugs the pure-Kotlin codecs into Coil's pipeline while network and caching stay Coil's, and KiteAsyncImage() plays GIF, APNG and animated lossless WebP. Builds for the seven Compose Multiplatform targets, not the full ImageKodec core set; add imagekodec-compose yourself, it is not exposed transitively.
