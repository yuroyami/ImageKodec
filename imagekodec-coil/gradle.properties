POM_NAME=ImageKodec Coil
POM_DESCRIPTION=Coil interop for ImageKodec: KiteImageDecoder plugs the pure-Kotlin codecs into Coil's pipeline while network and caching stay Coil's, and KiteAsyncImage() plays GIF, APNG, animated WebP, animated AVIF and animated JPEG XL. Builds for the seven Compose Multiplatform targets, not the full ImageKodec core set; imagekodec-compose is a runtime dependency; declare it directly to call its public API.
