name: Set up the build
description: >
  Restores the Kotlin Toolchain cache: the toolchain itself, its JDKs, Kotlin/Native, Node and the
  libraries the build downloads. Run actions/checkout first.

outputs:
  cache-key:
    description: The key of the toolchain cache.
    value: ${{ steps.toolchain.outputs.cache-primary-key }}
  cache-hit:
    description: The word true when the toolchain cache was restored.
    value: ${{ steps.toolchain.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The toolchain downloads more than a gigabyte, most of it Kotlin/Native, and a download costs
    # minutes. Every job of an operating system uses the same files, so they share one cache, and
    # GitHub keeps only 10 GB of caches for a repository. One job for each operating system saves
    # it, with actions/cache/save as its last step. The key has no commit in it, so the cache stays
    # until a version or the build changes.
    - id: toolchain
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/JetBrains/Kotlin' || '~/.cache/JetBrains/Kotlin' }}
        key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('kotlin', 'project.yaml', '**/module.yaml', '*.module-template.yaml', 'libs.versions.toml', 'build-plugins/**') }}
        restore-keys: kotlin-toolchain-${{ runner.os }}-
