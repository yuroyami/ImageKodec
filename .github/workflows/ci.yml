name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

jobs:
  # The JVM, JS, wasm and Linux/Windows native targets. This is the job that
  # runs the full test suite: the codecs are pure computation, so a pass here
  # covers the decoders everywhere. The stb_image oracle needs no tool (its
  # vectors are committed); the OpenJPEG, libwebp, libtiff, libjpeg (headers too, for tools/arith_jpeg.c), jbig2enc, ffmpeg, libavif and libheif suites
  # skip themselves when their binary is missing on a contributor's machine, and
  # IMAGEKODEC_REQUIRE_ORACLES turns that skip into a failure here.
  linux:
    name: JVM / JS / wasm / native (Linux)
    runs-on: ubuntu-latest
    env:
      IMAGEKODEC_REQUIRE_ORACLES: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            11
            21

      # The oracle suites skip themselves when their tool is missing, and a
      # skipped test reads exactly like a passing one, so these are installed
      # rather than left to chance, and a missing one fails this step. The tests
      # find them on PATH. Ubuntu's ImageMagick is version 6, whose command is
      # `convert`; the tests fall back to it when there is no `magick`.
      # The T.81 reference software (Thomas Richter's libjpeg, GPL-3.0, run as a tool and
      # never linked) writes lossless JPEG at every precision and arithmetic coding, which
      # nothing packaged does. Release 1.70: later commits cannot write lossless files.
      # The patch lets the tests choose its predictor and point transform.
      - name: Build the T.81 reference codec
        run: |
          git clone --quiet https://github.com/thorfdbg/libjpeg.git /tmp/t81
          git -C /tmp/t81 checkout --quiet c719010
          git -C /tmp/t81 apply "$GITHUB_WORKSPACE/tools/t81-libjpeg.patch"
          (cd /tmp/t81 && ./configure > /dev/null && make -j"$(nproc)" > /dev/null)
          sudo install -m 755 /tmp/t81/jpeg /usr/local/bin/t81jpeg
          command -v t81jpeg || { echo "::error::t81jpeg did not build"; exit 1; }

      # libjpeg-turbo 3.1 writes and reads 12-bit JPEG; the packaged 2.1 does not.
      - name: Build libjpeg-turbo 3.1
        run: |
          git clone --quiet --depth 1 --branch 3.1.0 https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt3
          cmake -S /tmp/ljt3 -B /tmp/ljt3/build -DENABLE_SHARED=0 -DWITH_SIMD=0 > /dev/null
          make -C /tmp/ljt3/build -j"$(nproc)" cjpeg-static djpeg-static > /dev/null
          sudo install -m 755 /tmp/ljt3/build/cjpeg-static /usr/local/bin/cjpeg3
          sudo install -m 755 /tmp/ljt3/build/djpeg-static /usr/local/bin/djpeg3
          cjpeg3 -version

      - name: Install codec oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y webp libtiff-tools imagemagick libopenjp2-tools libjpeg-turbo-progs jbig2 jbig2dec ffmpeg libavif-bin libavif-dev libheif-examples python3-pil libjpeg-turbo8-dev liblcms2-dev icc-profiles-free
          missing=0
          for t in cwebp dwebp tiffcp opj_compress opj_decompress cjpeg djpeg jpegtran tiff2rgba jbig2 jbig2dec ffmpeg avifenc heif-convert cc; do
            command -v "$t" >/dev/null || { echo "::error::oracle tool $t not on PATH"; missing=1; }
          done
          command -v magick >/dev/null || command -v convert >/dev/null || { echo "::error::ImageMagick not on PATH"; missing=1; }
          [ -f /usr/include/avif/avif.h ] || { echo "::error::libavif headers missing"; missing=1; }
          [ -f /usr/include/jpeglib.h ] || { echo "::error::libjpeg headers missing"; missing=1; }
          [ -f /usr/include/lcms2.h ] || { echo "::error::lcms2 headers missing"; missing=1; }
          [ -f /usr/share/color/icc/sRGB.icc ] || { echo "::error::icc-profiles-free missing"; missing=1; }
          python3 -c "import PIL" || { echo "::error::Pillow missing"; missing=1; }
          exit $missing

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests (JVM)
        run: ./gradlew :imagekodec:jvmTest --stacktrace

      - name: Core tests (JS + wasm)
        run: ./gradlew :imagekodec:jsNodeTest :imagekodec:wasmJsNodeTest :imagekodec:wasmWasiNodeTest --stacktrace

      - name: Core tests (native)
        run: ./gradlew :imagekodec:linuxX64Test --stacktrace

      - name: Compose and Coil tests
        run: ./gradlew :imagekodec-compose:jvmTest :imagekodec-coil:jvmTest --stacktrace

      - name: Core and bindings on Java 11
        run: ./gradlew :imagekodec:jvmJava11Test :imagekodec-compose:jvmJava11Test :imagekodec-coil:jvmJava11Test --stacktrace

      - name: Public API check
        run: ./gradlew checkLegacyAbi --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-linux
          path: '**/build/reports/tests/**'

  # Apple targets can only be built on a Mac, and they are the reason this
  # library exists in the first place, so they get their own job rather than
  # riding along as a compile-only check.
  apple:
    name: Apple targets (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Native tests
        run: ./gradlew :imagekodec:macosArm64Test :imagekodec:iosSimulatorArm64Test --stacktrace

      - name: Compose and Coil compile for every target
        run: ./gradlew :imagekodec-compose:assemble :imagekodec-coil:assemble --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-apple
          path: '**/build/reports/tests/**'

  # The Android variants build through AGP, which neither job above exercises.
  android:
    name: Android library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android variants
        run: ./gradlew :imagekodec:assemble :imagekodec-compose:assemble :imagekodec-coil:assemble --stacktrace

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Dokka site
        run: ./gradlew dokkaGenerate --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/dokka/html
