name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -Dorg.gradle.daemon=false

# How this workflow is shaped, and why.
#
# Each job compiles one thing once and then runs everything that needs it. The jobs share
# nothing that costs more to compile than to pass between machines, so they all start with
# the push. The JS tests are the exception: one job compiles them and four machines run them.
#
# The fuzz suite is most of the test time on every target, and one process runs it on one
# core. After a job compiles its test program, tools/run-shards.sh runs the program as several
# processes at once, each with its own share of the mutants (FuzzShard.kt), so the suite uses
# every core of the runner. The JVM jobs do the same with Gradle's test forks.
#
# A native test program is linked optimised here (-PoptimizedNativeTests): the link takes
# about a minute longer and the fuzz suite runs about eight times faster.
#
# GitHub runs at most five macOS jobs of one account at a time, across all its repositories,
# so there are five. When another repository holds some of the five, the jobs here wait.
#
# One job for each operating system saves the Kotlin/Native cache (`build` and
# `link-debug-frameworks`), and the others restore it. .github/actions/setup explains why.
jobs:
  # The JVM suite is the one that holds the decoders to the reference codecs. The OpenJPEG,
  # libwebp, libtiff, libjpeg, jbig2enc, ffmpeg, libavif, libheif and libjxl suites skip
  # themselves when their binary is missing on a contributor's machine, and
  # IMAGEKODEC_REQUIRE_ORACLES turns that skip into a failure here.
  #
  # The suite takes more than three minutes on one Java version, so each version has its own
  # machine. Each machine compiles the tests, which takes about a minute. Passing the
  # compiled classes from one machine to two others would take longer than that.
  test-jvm:
    name: JVM tests on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 21
            tasks: :imagekodec:jvmTest :imagekodec-compose:jvmTest :imagekodec-coil:jvmTest
          - java: 11
            tasks: :imagekodec:jvmJava11Test :imagekodec-compose:jvmJava11Test :imagekodec-coil:jvmJava11Test
    env:
      IMAGEKODEC_REQUIRE_ORACLES: '1'
      T81_COMMIT: c719010
      LIBJPEG_TURBO: 3.1.0
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on Java 21 and starts the test JVMs of the Java 11 tasks on Java 11.
      - uses: ./.github/actions/setup
        with:
          java-version: |
            11
            21

      # Two oracle tools have no package and are built from source. The build takes most of
      # a minute, so the binaries are kept until a version or the patch changes.
      - name: Restore the oracle tools built from source
        id: built-tools
        uses: actions/cache@v4
        with:
          path: ~/oracle-tools
          key: oracle-tools-${{ runner.os }}-${{ env.T81_COMMIT }}-${{ env.LIBJPEG_TURBO }}-${{ hashFiles('tools/t81-libjpeg.patch') }}

      # The T.81 reference software (Thomas Richter's libjpeg, GPL-3.0, run as a tool and
      # never linked) writes lossless JPEG at every precision and arithmetic coding, which
      # nothing packaged does. Release 1.70: later commits cannot write lossless files.
      # The patch lets the tests choose its predictor and point transform.
      # libjpeg-turbo 3.1 writes and reads 12-bit JPEG; the packaged 2.1 does not.
      - name: Build the oracle tools that have no package
        if: steps.built-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/oracle-tools
          git clone --quiet https://github.com/thorfdbg/libjpeg.git /tmp/t81
          git -C /tmp/t81 checkout --quiet "$T81_COMMIT"
          git -C /tmp/t81 apply "$GITHUB_WORKSPACE/tools/t81-libjpeg.patch"
          (cd /tmp/t81 && ./configure > /dev/null && make -j"$(nproc)" > /dev/null)
          install -m 755 /tmp/t81/jpeg ~/oracle-tools/t81jpeg
          git clone --quiet --depth 1 --branch "$LIBJPEG_TURBO" https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt3
          cmake -S /tmp/ljt3 -B /tmp/ljt3/build -DENABLE_SHARED=0 -DWITH_SIMD=0 > /dev/null
          make -C /tmp/ljt3/build -j"$(nproc)" cjpeg-static djpeg-static > /dev/null
          install -m 755 /tmp/ljt3/build/cjpeg-static ~/oracle-tools/cjpeg3
          install -m 755 /tmp/ljt3/build/djpeg-static ~/oracle-tools/djpeg3

      # A skipped oracle test reads exactly like a passing one, so the tools are installed
      # rather than left to chance, and a missing one fails this step. The tests find them on
      # PATH. Ubuntu's ImageMagick is version 6, whose command is `convert`; the tests fall
      # back to it when there is no `magick`.
      - name: Install the oracle tools
        run: |
          echo "$HOME/oracle-tools" >> "$GITHUB_PATH"
          export PATH="$HOME/oracle-tools:$PATH"
          sudo apt-get update
          sudo apt-get install -y webp libtiff-tools imagemagick libopenjp2-tools libjpeg-turbo-progs jbig2 jbig2dec ffmpeg libavif-bin libavif-dev libheif-examples python3-pil libjpeg-turbo8-dev liblcms2-dev icc-profiles-free libjxl-tools
          missing=0
          for t in cwebp dwebp tiffcp opj_compress opj_decompress cjpeg djpeg jpegtran tiff2rgba jbig2 jbig2dec ffmpeg avifenc heif-convert cc cjxl djxl t81jpeg cjpeg3 djpeg3; do
            command -v "$t" >/dev/null || { echo "::error::oracle tool $t not on PATH"; missing=1; }
          done
          command -v magick >/dev/null || command -v convert >/dev/null || { echo "::error::ImageMagick not on PATH"; missing=1; }
          [ -f /usr/include/avif/avif.h ] || { echo "::error::libavif headers missing"; missing=1; }
          [ -f /usr/include/jpeglib.h ] || { echo "::error::libjpeg headers missing"; missing=1; }
          [ -f /usr/include/lcms2.h ] || { echo "::error::lcms2 headers missing"; missing=1; }
          [ -f /usr/share/color/icc/sRGB.icc ] || { echo "::error::icc-profiles-free missing"; missing=1; }
          python3 -c "import PIL" || { echo "::error::Pillow missing"; missing=1; }
          exit $missing

      # One compile serves all three modules. Each test class runs in one of three JVMs.
      - name: Core, Compose and Coil tests
        run: ./gradlew ${{ matrix.tasks }} -PtestForks=3 --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/build/reports/tests/**'

  # Kotlin/JS does 64-bit arithmetic in software, so the JS suite takes about 16 minutes of
  # one core, and a runner has two cores. This job compiles the tests once and packs them
  # with the Node that Kotlin downloads. The next job runs them on four machines.
  test-js-compile:
    name: JS tests, compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Compile the tests
        run: ./gradlew :imagekodec:jsTestTestDevelopmentExecutableCompileSync kotlinNodeJsSetup kotlinNpmInstall --stacktrace

      # A tar file keeps the links and the permission to run that an artifact loses.
      - name: Pack the tests
        run: |
          node=$(find ~/.gradle/nodejs -maxdepth 3 -path '*/bin/node' | sort -V | tail -n 1)
          tar -I 'zstd -T0' -cf js-tests.tar.zst \
            -C "$(dirname "$node")" node \
            -C "$GITHUB_WORKSPACE/tools" run-shards.sh \
            -C "$GITHUB_WORKSPACE/build/js" node_modules packages/ImageKodec-KMP-imagekodec-test

      - uses: actions/upload-artifact@v4
        with:
          name: js-tests
          path: js-tests.tar.zst
          compression-level: 0
          retention-days: 1

  # Two processes for each machine: a third would slow the others, and the slowest mutant
  # would then pass the deadline that FuzzTest gives each one.
  test-js:
    name: JS tests, shards ${{ matrix.shards }} of 8
    needs: test-js-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shards: ['0-1', '2-3', '4-5', '6-7']
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: js-tests

      # The command Gradle's jsNodeTest runs.
      - name: Run the tests
        run: |
          tar -I zstd -xf js-tests.tar.zst
          cd packages/ImageKodec-KMP-imagekodec-test
          ../../run-shards.sh ${{ matrix.shards }}/8 ../../node \
            --require ../../node_modules/source-map-support/register.js \
            ../../node_modules/mocha/bin/mocha.js kotlin/ImageKodec-KMP-imagekodec-test.js \
            --timeout 600s --reporter dot

  test-wasm:
    name: wasmJs and wasmWasi tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Compile the tests
        run: >
          ./gradlew
          :imagekodec:wasmJsTestTestDevelopmentExecutableCompileSync
          :imagekodec:compileTestDevelopmentExecutableKotlinWasmWasi
          kotlinWasmNodeJsSetup --stacktrace

      # What Gradle's wasmJsNodeTest and wasmWasiNodeTest run: Node loads the module and
      # calls startUnitTests. Each target runs as two processes, so four run at once.
      - name: Run the tests
        run: |
          node=$(find ~/.gradle/nodejs -maxdepth 3 -path '*/bin/node' | sort -V | tail -n 1)
          start='import { pathToFileURL } from "node:url"; const tests = await import(pathToFileURL(process.argv[1]).href); tests.startUnitTests();'
          tools/run-shards.sh 2 "$node" --input-type=module --eval "$start" \
            "$PWD/build/wasm/packages/ImageKodec-KMP-imagekodec-test/kotlin/ImageKodec-KMP-imagekodec-test.mjs" \
            > wasm-js.log 2>&1 &
          wasm_js=$!
          tools/run-shards.sh 2 "$node" --input-type=module --eval "$start" \
            "$PWD/imagekodec/build/compileSync/wasmWasi/test/testDevelopmentExecutable/kotlin/ImageKodec-KMP-imagekodec-test.mjs" \
            > wasm-wasi.log 2>&1 &
          wasm_wasi=$!
          failed=0
          wait "$wasm_js" || { echo "::error::wasmJs tests failed"; failed=1; }
          echo "===== wasmJs ====="; cat wasm-js.log
          wait "$wasm_wasi" || { echo "::error::wasmWasi tests failed"; failed=1; }
          echo "===== wasmWasi ====="; cat wasm-wasi.log
          exit $failed

  test-linux:
    name: linuxX64 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          kotlin-native: 'true'

      - name: Link the tests
        run: ./gradlew :imagekodec:linkDebugTestLinuxX64 -PoptimizedNativeTests --stacktrace

      - name: Run the tests
        run: tools/run-shards.sh 4 imagekodec/build/bin/linuxX64/debugTest/test.kexe

  # Every target that a Linux machine builds: Android, JVM, JS, wasm, the sample app, and the
  # library of every native target, the ten Apple ones too, with the tests of each native
  # target compiled. Only a link of an Apple program needs a Mac. The public API check reads
  # what this build compiles.
  build:
    name: Build every target, check the public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        id: setup
        with:
          kotlin-native: 'true'

      - name: Assemble every module and check the public API
        run: ./gradlew assemble checkLegacyAbi --stacktrace

      - name: Save the Kotlin/Native cache
        if: steps.setup.outputs.kotlin-native-hit != 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.setup.outputs.kotlin-native-key }}

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          kotlin-native: 'true'

      - name: Build the Dokka site
        run: ./gradlew dokkaGenerate --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: build/dokka/html

  # Apple programs link only on a Mac, and Apple targets are the reason this library exists,
  # so its tests run on two of them.
  test-apple:
    name: ${{ matrix.target }} tests
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosArm64
            link: linkDebugTestMacosArm64
          - target: iosSimulatorArm64
            link: linkDebugTestIosSimulatorArm64
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          kotlin-native: 'true'

      - name: Link the tests
        run: ./gradlew :imagekodec:${{ matrix.link }} -PoptimizedNativeTests --stacktrace

      - name: Run the tests
        run: |
          program=imagekodec/build/bin/${{ matrix.target }}/debugTest/test.kexe
          if [ "${{ matrix.target }}" = iosSimulatorArm64 ]; then
            # What Gradle's iosSimulatorArm64Test runs: the program inside a simulator that is not booted.
            device=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]*\([0-9A-F-]{36}\)' | head -n 1 | grep -oE '[0-9A-F-]{36}')
            [ -n "$device" ] || { echo "::error::no iPhone simulator on this runner"; exit 1; }
            tools/run-shards.sh 3 xcrun simctl spawn --standalone "$device" "$program"
          else
            tools/run-shards.sh 3 "$program"
          fi

  # The Compose and Coil modules each link a release framework for each iOS target. A release
  # link optimises the whole program for more than two minutes, so each target has its own
  # machine. Two release links at once do not fit in the memory of a macOS runner and take
  # three times as long, so one Gradle worker runs them one after the other.
  link-release-frameworks:
    name: ${{ matrix.target }} release frameworks
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [IosArm64, IosSimulatorArm64]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          kotlin-native: 'true'

      - name: Link the Compose and Coil release frameworks
        run: >
          ./gradlew
          :imagekodec-compose:linkReleaseFramework${{ matrix.target }}
          :imagekodec-coil:linkReleaseFramework${{ matrix.target }}
          --max-workers=1 --stacktrace

  # A debug link is quick once Kotlin/Native has compiled each dependency for the target, and
  # the Kotlin/Native cache keeps those. This job builds them when a version in the catalog
  # changes, which takes about ten minutes longer, so it has a longer limit.
  link-debug-frameworks:
    name: Debug frameworks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        id: setup
        with:
          kotlin-native: 'true'

      - name: Link the Compose and Coil debug frameworks
        run: >
          ./gradlew
          :imagekodec-compose:linkDebugFrameworkIosArm64
          :imagekodec-compose:linkDebugFrameworkIosSimulatorArm64
          :imagekodec-coil:linkDebugFrameworkIosArm64
          :imagekodec-coil:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

      - name: Save the Kotlin/Native cache
        if: steps.setup.outputs.kotlin-native-hit != 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ steps.setup.outputs.kotlin-native-key }}
