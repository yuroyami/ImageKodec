name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

# How this workflow is shaped, and why.
#
# Each job compiles one thing once and then runs everything that needs it. The jobs share
# nothing that costs more to compile than to pass between machines, so they all start with
# the push. The JS tests are the exception: one job compiles them and four machines run them.
#
# The Kotlin Toolchain (`./kotlin`) runs the JVM and Android tests itself. It does not run JS or
# wasmWasi tests, and its wasmJs runner stops a test after 30 seconds, which the fuzz suite
# passes. For those targets and for the native ones, a job links the test program with
# `./kotlin task` and runs it here.
#
# The fuzz suite is most of the test time on every target, and one process runs it on one
# core. tools/run-shards.sh runs a test program as several processes at once, each with its own
# share of the mutants (FuzzShard.kt), so the suite uses every core of the runner.
#
# A native test program is linked optimised here (the Release link task): the link takes about
# a minute longer and the fuzz suite runs about eight times faster.
#
# GitHub runs at most five macOS jobs of one account at a time, across all its repositories,
# so there are five. When another repository holds some of the five, the jobs here wait.
#
# One job for each operating system saves the toolchain cache (`build` and
# `link-debug-frameworks`), and the others restore it. .github/actions/setup explains why.
jobs:
  # The JVM suite is the one that holds the decoders to the reference codecs. The OpenJPEG,
  # libwebp, libtiff, libjpeg, jbig2enc, ffmpeg, libavif, libheif and libjxl suites skip
  # themselves when their binary is missing on a contributor's machine, and
  # IMAGEKODEC_REQUIRE_ORACLES turns that skip into a failure here.
  #
  # The libraries target Java 11, so the suite runs on Java 11 as well as on the Java 21 that
  # builds them. The toolchain runs tests on JDK 17 or later only, so the Java 11 job compiles
  # the tests and tools/java11_tests.py runs them on Java 11 with JUnit.
  test-jvm:
    name: JVM tests on Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        java: [21, 11]
    env:
      IMAGEKODEC_REQUIRE_ORACLES: '1'
      T81_COMMIT: c719010
      LIBJPEG_TURBO: 3.1.0
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # Two oracle tools have no package and are built from source. The build takes most of
      # a minute, so the binaries are kept until a version or the patch changes.
      - name: Restore the oracle tools built from source
        id: built-tools
        uses: actions/cache@v6
        with:
          path: ~/oracle-tools
          key: oracle-tools-${{ runner.os }}-${{ env.T81_COMMIT }}-${{ env.LIBJPEG_TURBO }}-${{ hashFiles('tools/t81-libjpeg.patch') }}

      # The T.81 reference software (Thomas Richter's libjpeg, GPL-3.0, run as a tool and
      # never linked) writes lossless JPEG at every precision and arithmetic coding, which
      # nothing packaged does. Release 1.70: later commits cannot write lossless files.
      # The patch lets the tests choose its predictor and point transform.
      # libjpeg-turbo 3.1 writes and reads 12-bit JPEG; the packaged 2.1 does not.
      - name: Build the oracle tools that have no package
        if: steps.built-tools.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/oracle-tools
          git clone --quiet https://github.com/thorfdbg/libjpeg.git /tmp/t81
          git -C /tmp/t81 checkout --quiet "$T81_COMMIT"
          git -C /tmp/t81 apply "$GITHUB_WORKSPACE/tools/t81-libjpeg.patch"
          (cd /tmp/t81 && ./configure > /dev/null && make -j"$(nproc)" > /dev/null)
          install -m 755 /tmp/t81/jpeg ~/oracle-tools/t81jpeg
          git clone --quiet --depth 1 --branch "$LIBJPEG_TURBO" https://github.com/libjpeg-turbo/libjpeg-turbo.git /tmp/ljt3
          cmake -S /tmp/ljt3 -B /tmp/ljt3/build -DENABLE_SHARED=0 -DWITH_SIMD=0 > /dev/null
          make -C /tmp/ljt3/build -j"$(nproc)" cjpeg-static djpeg-static > /dev/null
          install -m 755 /tmp/ljt3/build/cjpeg-static ~/oracle-tools/cjpeg3
          install -m 755 /tmp/ljt3/build/djpeg-static ~/oracle-tools/djpeg3

      # A skipped oracle test reads exactly like a passing one, so the tools are installed
      # rather than left to chance, and a missing one fails this step. The tests find them on
      # PATH. Ubuntu's ImageMagick is version 6, whose command is `convert`; the tests fall
      # back to it when there is no `magick`.
      - name: Install the oracle tools
        run: |
          echo "$HOME/oracle-tools" >> "$GITHUB_PATH"
          export PATH="$HOME/oracle-tools:$PATH"
          sudo apt-get update
          sudo apt-get install -y webp libtiff-tools imagemagick libopenjp2-tools libjpeg-turbo-progs jbig2 jbig2dec ffmpeg libavif-bin libavif-dev libheif-examples python3-pil libjpeg-turbo8-dev liblcms2-dev icc-profiles-free libjxl-tools
          missing=0
          for t in cwebp dwebp tiffcp opj_compress opj_decompress cjpeg djpeg jpegtran tiff2rgba jbig2 jbig2dec ffmpeg avifenc heif-convert cc cjxl djxl t81jpeg cjpeg3 djpeg3; do
            command -v "$t" >/dev/null || { echo "::error::oracle tool $t not on PATH"; missing=1; }
          done
          command -v magick >/dev/null || command -v convert >/dev/null || { echo "::error::ImageMagick not on PATH"; missing=1; }
          [ -f /usr/include/avif/avif.h ] || { echo "::error::libavif headers missing"; missing=1; }
          [ -f /usr/include/jpeglib.h ] || { echo "::error::libjpeg headers missing"; missing=1; }
          [ -f /usr/include/lcms2.h ] || { echo "::error::lcms2 headers missing"; missing=1; }
          [ -f /usr/share/color/icc/sRGB.icc ] || { echo "::error::icc-profiles-free missing"; missing=1; }
          python3 -c "import PIL" || { echo "::error::Pillow missing"; missing=1; }
          exit $missing

      - name: Core, Compose and Coil tests
        if: matrix.java == 21
        run: ./kotlin test -p jvm

      - uses: actions/setup-java@v6
        if: matrix.java == 11
        id: java11
        with:
          distribution: temurin
          java-version: '11'

      - name: Core, Compose and Coil tests
        if: matrix.java == 11
        run: |
          ./kotlin build -p jvm -m imagekodec -m imagekodec-compose -m imagekodec-coil
          tools/java11_tests.py --java "${{ steps.java11.outputs.path }}/bin/java"

  # The common suite runs on the JVM as Android host tests.
  test-android:
    name: Android host tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run the tests
        run: ./kotlin test -p android

  # Kotlin/JS does 64-bit arithmetic in software, so the JS suite takes about 16 minutes of
  # one core, and a runner has two cores. This job links the tests once and packs them with
  # mocha. The next job runs them on four machines.
  test-js-compile:
    name: JS tests, compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Link the tests
        run: ./kotlin task :imagekodec:linkJsTest

      # A tar file keeps the links and the permission to run that an artifact loses.
      - name: Pack the tests with mocha
        run: |
          npm install --prefix "$RUNNER_TEMP/mocha" --no-save --no-package-lock mocha@11.7.5
          tar -I 'zstd -T0' -cf js-tests.tar.zst \
            -C "$GITHUB_WORKSPACE/build/artifacts/CompiledWebArtifact/imagekodecjsTestrelease" kotlin-output \
            -C "$RUNNER_TEMP/mocha" node_modules \
            -C "$GITHUB_WORKSPACE/tools" run-shards.sh

      - uses: actions/upload-artifact@v7
        with:
          name: js-tests
          path: js-tests.tar.zst
          compression-level: 0
          retention-days: 1

  # Two processes for each machine: a third would slow the others, and the slowest mutant
  # would then pass the deadline that FuzzTest gives each one.
  test-js:
    name: JS tests, shards ${{ matrix.shards }} of 8
    needs: test-js-compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shards: ['0-1', '2-3', '4-5', '6-7']
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: js-tests

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run the tests
        run: |
          tar -I zstd -xf js-tests.tar.zst
          cd kotlin-output
          ../run-shards.sh ${{ matrix.shards }}/8 node ../node_modules/mocha/bin/mocha.js \
            imagekodec_test.mjs --timeout 600s --reporter dot

  test-wasm:
    name: wasmJs and wasmWasi tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Link the tests
        run: |
          ./kotlin task :imagekodec:linkWasmJsTestDebug
          ./kotlin task :imagekodec:linkWasmWasiTestDebug

      # Node loads each test module and calls startUnitTests. Each target runs as two
      # processes, so four run at once.
      - name: Run the tests
        run: |
          start='import { pathToFileURL } from "node:url"; const tests = await import(pathToFileURL(process.argv[1]).href); tests.startUnitTests();'
          web=build/artifacts/CompiledWebArtifact
          tools/run-shards.sh 2 node --input-type=module --eval "$start" \
            "$PWD/$web/imagekodecwasmJsTestdebug/kotlin-output/imagekodec_test.mjs" \
            > wasm-js.log 2>&1 &
          wasm_js=$!
          tools/run-shards.sh 2 node --input-type=module --eval "$start" \
            "$PWD/$web/imagekodecwasmWasiTestdebug/kotlin-output/imagekodec_test.mjs" \
            > wasm-wasi.log 2>&1 &
          wasm_wasi=$!
          failed=0
          wait "$wasm_js" || { echo "::error::wasmJs tests failed"; failed=1; }
          echo "===== wasmJs ====="; cat wasm-js.log
          wait "$wasm_wasi" || { echo "::error::wasmWasi tests failed"; failed=1; }
          echo "===== wasmWasi ====="; cat wasm-wasi.log
          exit $failed

  test-linux:
    name: linuxX64 tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Link the tests
        run: ./kotlin task :imagekodec:linkLinuxX64TestRelease

      - name: Run the tests
        run: tools/run-shards.sh 4 build/tasks/_imagekodec_linkLinuxX64TestRelease/imagekodec_test.kexe

  # Every platform that a Linux machine builds: Android, JVM, JS, Wasm, the sample app, and the
  # Linux, Windows and androidNative libraries, each with its tests compiled. The Apple
  # platforms build on a Mac, in link-debug-frameworks. The JVM public API check reads the
  # classes this build compiles; the klib check in klib-abi reads the klibs it uploads.
  build:
    name: Build every non-Apple platform, check the public API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        id: setup

      - name: Build
        run: >
          ./kotlin build
          -p jvm -p android -p js -p wasmJs -p wasmWasi
          -p linuxX64 -p linuxArm64 -p mingwX64
          -p androidNativeArm32 -p androidNativeArm64 -p androidNativeX64 -p androidNativeX86

      - name: Check the JVM public API
        run: ./kotlin check abi

      - uses: actions/upload-artifact@v7
        with:
          name: klibs-linux
          path: |
            build/tasks/_*_compile*/*.klib
            !build/tasks/_*_compile*/*_test.klib
          retention-days: 1

      - name: Save the toolchain cache
        if: steps.setup.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: ${{ steps.setup.outputs.cache-key }}

  docs:
    name: API documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # `do` is a command of the kotlin script here, not the shell keyword.
      - name: Build the Dokka site
        run: |
          # shellcheck disable=SC1010
          ./kotlin do dokka && ./kotlin do dokkaSite

      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: build/dokka/html

  # Apple programs link only on a Mac, and Apple targets are the reason this library exists,
  # so its tests run on two of them.
  test-apple:
    name: ${{ matrix.target }} tests
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [MacosArm64, IosSimulatorArm64]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Link the tests
        run: ./kotlin task :imagekodec:link${{ matrix.target }}TestRelease

      - name: Run the tests
        run: |
          program=build/tasks/_imagekodec_link${{ matrix.target }}TestRelease/imagekodec_test.kexe
          if [ "${{ matrix.target }}" = IosSimulatorArm64 ]; then
            # The program inside a simulator that is not booted.
            device=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]*\([0-9A-F-]{36}\)' | head -n 1 | grep -oE '[0-9A-F-]{36}')
            [ -n "$device" ] || { echo "::error::no iPhone simulator on this runner"; exit 1; }
            tools/run-shards.sh 3 xcrun simctl spawn --standalone "$device" "$PWD/$program"
          else
            tools/run-shards.sh 3 "$program"
          fi

  # The Compose and Coil modules each link a release framework for each iOS target. A release
  # link optimises the whole program for more than two minutes, so each target has its own
  # machine. Two release links at once do not fit in the memory of a macOS runner and take
  # three times as long, so tools/apple_frameworks.py links them one after the other.
  link-release-frameworks:
    name: ${{ matrix.platform }} release frameworks
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iosArm64
            task: IosArm64
          - platform: iosSimulatorArm64
            task: IosSimulatorArm64
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Compile the libraries
        run: |
          for module in imagekodec imagekodec-compose imagekodec-coil; do
            ./kotlin task ":$module:compile${{ matrix.task }}Debug"
          done

      - name: Link the Compose and Coil release frameworks
        run: >
          tools/apple_frameworks.py --build-type release --no-xcframework
          --platforms ${{ matrix.platform }} --frameworks ImageKodecCompose,ImageKodecCoil

  # Builds every Apple platform, then links the debug frameworks. A debug link is quick once
  # Kotlin/Native has compiled each dependency for the target, and the toolchain cache keeps
  # those. This job builds them when a version changes, which takes about ten minutes longer,
  # so it has a longer limit.
  link-debug-frameworks:
    name: Apple platforms, debug frameworks
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        id: setup

      - name: Build every Apple platform
        run: >
          ./kotlin build
          -p iosArm64 -p iosSimulatorArm64 -p iosX64 -p macosArm64
          -p tvosArm64 -p tvosSimulatorArm64
          -p watchosArm32 -p watchosArm64 -p watchosDeviceArm64 -p watchosSimulatorArm64

      - name: Link the debug frameworks
        run: tools/apple_frameworks.py --build-type debug --no-xcframework --platforms iosArm64,iosSimulatorArm64

      - uses: actions/upload-artifact@v7
        with:
          name: klibs-apple
          path: |
            build/tasks/_*_compile*/*.klib
            !build/tasks/_*_compile*/*_test.klib
          retention-days: 1

      - name: Save the toolchain cache
        if: steps.setup.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@v6
        with:
          path: ~/Library/Caches/JetBrains/Kotlin
          key: ${{ steps.setup.outputs.cache-key }}

  # The klib public API check merges the klibs of every native and web platform into one dump.
  # Linux builds some of them and a Mac builds the Apple ones, so this job gathers both.
  klib-abi:
    name: Check the klib public API
    needs: [build, link-debug-frameworks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          pattern: klibs-*
          path: build/tasks
          merge-multiple: true

      - name: Check the klib public API
        run: ./kotlin check klibAbi
