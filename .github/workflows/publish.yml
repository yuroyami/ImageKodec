name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the artifacts without uploading them
        type: boolean
        default: true

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

# Apple targets can only be built on a Mac, and a KMP release has to publish
# every target from one build, so the whole release runs on macOS.
jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    env:
      KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # The klib check reads the klibs of every native and web platform, which a Mac builds.
      - name: Check the public API has not drifted
        run: |
          ./kotlin build -p iosArm64 -p iosSimulatorArm64 -p iosX64 -p macosArm64 -p tvosArm64 \
            -p tvosSimulatorArm64 -p watchosArm32 -p watchosArm64 -p watchosDeviceArm64 \
            -p watchosSimulatorArm64 -p androidNativeArm32 -p androidNativeArm64 -p androidNativeX64 \
            -p androidNativeX86 -p linuxX64 -p linuxArm64 -p mingwX64 -p js -p wasmJs -p wasmWasi
          ./kotlin check abi klibAbi

      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: ./kotlin publish mavenCentral -m imagekodec -m imagekodec-compose -m imagekodec-coil

      - name: Dry run (build and sign only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./kotlin publish mavenLocal -m imagekodec -m imagekodec-compose -m imagekodec-coil
