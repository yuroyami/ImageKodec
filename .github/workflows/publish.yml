name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the artifacts without uploading them
        type: boolean
        default: true

permissions:
  contents: read

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

# Apple targets can only be built on a Mac, and a KMP release has to publish
# every target from one build, so the whole release runs on macOS.
jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    timeout-minutes: 240
    # The secrets live on the steps that sign and upload, not on the job, so the setup and the
    # API check, which download and run the toolchain, never see them. The toolchain gets the
    # signing key only, and the upload step gets the Central Portal token only.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # settings.publishing.version of library.module-template.yaml, the version of every module.
      - name: Read the version
        id: version
        run: |
          version=$(awk '/^  publishing:/ { found = 1 } found && /^    version:/ { print $2; exit }' library.module-template.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ImageKodec $version"

      # A release whose tag does not name the version would publish another version than the tag says.
      - name: Check that the tag names the version
        if: ${{ github.event_name == 'release' }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::the release tag $TAG does not name version $VERSION of library.module-template.yaml"
            exit 1
          fi

      # Only the code a release ships compiles here, in the release variant that the Maven Central zip
      # reuses. `./kotlin build` also compiled and linked every test source set of every platform,
      # which ran for hours. The toolchain starts one Kotlin/Native compiler JVM of up to 3 GB per
      # task with no limit, so each native platform compiles in a call of its own.
      - name: Compile the native and web platforms, one platform at a time
        run: |
          compose_platforms=" IosArm64 IosSimulatorArm64 MacosArm64 "
          for platform in IosArm64 IosSimulatorArm64 IosX64 MacosArm64 TvosArm64 TvosSimulatorArm64 \
            WatchosArm32 WatchosArm64 WatchosDeviceArm64 WatchosSimulatorArm64 AndroidNativeArm32 \
            AndroidNativeArm64 AndroidNativeX64 AndroidNativeX86 LinuxX64 LinuxArm64 MingwX64; do
            echo "::group::$platform"
            tasks=(":imagekodec:compile${platform}Release" ":imagekodec-heic:compile${platform}Release")
            # The Compose and Coil modules ship only the platforms of Compose Multiplatform.
            if [[ $compose_platforms == *" $platform "* ]]; then
              tasks+=(":imagekodec-compose:compile${platform}Release" ":imagekodec-coil:compile${platform}Release")
            fi
            ./kotlin task "${tasks[@]}"
            echo "::endgroup::"
          done
          tasks=()
          for module in imagekodec imagekodec-heic; do tasks+=(":$module:compileWasmWasi"); done
          for module in imagekodec imagekodec-heic imagekodec-compose imagekodec-coil; do
            tasks+=(":$module:compileJs" ":$module:compileWasmJs")
          done
          ./kotlin task "${tasks[@]}"

      # A release whose public API differs from the committed references does not go out.
      - name: Check the public JVM API
        run: ./kotlin check abi -m imagekodec -m imagekodec-compose -m imagekodec-coil -m imagekodec-heic

      - name: Check the public klib API
        run: ./kotlin check klibAbi -m imagekodec -m imagekodec-compose -m imagekodec-coil -m imagekodec-heic

      # The toolchain compiles, signs and zips each module, and the script merges the four zips into
      # one. Uploaded as one deployment, the release passes Central's checks as a whole and goes out
      # complete or not at all. A dry run builds the same zip, so it tests all but the upload.
      - name: Build the Maven Central zip
        env:
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: scripts/central-zip.sh build/central-bundle.zip imagekodec imagekodec-compose imagekodec-coil imagekodec-heic

      - name: List the files in the Maven Central zip
        run: zipinfo -1 build/central-bundle.zip

      # publishingMode of library.module-template.yaml sets what Central does after its checks:
      # auto publishes the deployment, manual waits until the owner clicks Publish on the Central Portal.
      - name: Upload to Maven Central
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mode=$(awk '/^    mavenCentral:/ { found = 1 } found && /^      publishingMode:/ { print $2; exit }' library.module-template.yaml)
          case $mode in
            auto) type=AUTOMATIC ;;
            manual) type=USER_MANAGED ;;
            *)
              echo "::error::publishingMode of library.module-template.yaml is '$mode', not auto or manual"
              exit 1
              ;;
          esac
          scripts/central-upload.sh build/central-bundle.zip "ImageKodec $VERSION" "$type"
