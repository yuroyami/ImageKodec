name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign the artifacts without uploading them
        type: boolean
        default: true

# Apple targets can only be built on a Mac, and a KMP release has to publish
# every target from one build, so the whole release runs on macOS.
jobs:
  publish:
    name: Publish to Maven Central
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the public API has not drifted
        run: ./gradlew checkLegacyAbi --stacktrace

      - name: Publish
        if: ${{ github.event_name == 'release' || !inputs.dry_run }}
        run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_SIGNING_ENABLED: 'true'

      - name: Dry run (build and sign only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: ./gradlew publishToMavenLocal --no-configuration-cache --stacktrace
