# Settings that the three published libraries share. Each module.yaml applies this file.

# `./kotlin publish mavenLocal -m <module>` puts a build into ~/.m2 for tests in other projects.
repositories:
  - url: mavenLocal
    publish: true
    resolve: false

settings:
  kotlin:
    # Keep abi-tools in build-plugins/abi-check/module.yaml at the same version.
    version: 2.4.21
    explicitApi: strict
  jvm:
    jdk:
      version: 21
    # JVM 11 bytecode, so the libraries run on JDK 11 and later.
    release: 11
  # The JVM tests use JUnit 4's Assume to skip an oracle test when its tool is missing.
  junit: junit-4
  publishing:
    enabled: true
    group: io.github.yuroyami
    version: 0.3.0
    pom:
      url: https://github.com/yuroyami/ImageKodec
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: yuroyami
          name: yuroyami
          url: https://github.com/yuroyami
      scm:
        url: https://github.com/yuroyami/ImageKodec
        connection: scm:git:git://github.com/yuroyami/ImageKodec.git
        developerConnection: scm:git:ssh://git@github.com/yuroyami/ImageKodec.git
    signArtifacts: true
    publishSources: true
    mavenCentral:
      enabled: true
      publishingMode: auto

# -Xexport-kdoc keeps the KDoc in the native klibs.
settings@native:
  kotlin:
    freeCompilerArgs: [ -Xexport-kdoc ]
